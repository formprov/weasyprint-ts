name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - name: Install Ghostscript (used by the parity test to rasterize)
        run: sudo apt-get update && sudo apt-get install -y ghostscript
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
