<html><body>
        <style>
            @page {
                size: 18px 4px;
                @note-area {
                    content: element(sidenotes, all-once);
                    display: grid;
                    grid-template-columns: 1fr 1fr;
                    gap: 2px;
                }
            }
            div {
                color: red;
                font: 2px/1 weasyprint;
            }
            span {
                color: blue;
                display: block;
                position: note(sidenotes);
            }
        </style>
        <div>abc<span>d</span>fgh<span>i</span></div></body></html>
