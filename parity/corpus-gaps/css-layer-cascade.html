<!doctype html>
<html><head><meta charset="utf-8"><style>
  @layer base { #target { color: rgb(0, 0, 255) } }
  @layer theme { p { color: rgb(255, 0, 0) } }
  /* unlayered rules beat every layer, whatever the specificity */
  p.note { color: rgb(0, 128, 0) }
</style></head>
<body>
  <p id="target">layer order beats specificity: this is red</p>
  <p class="note">unlayered beats layered: this is green</p>
</body></html>
