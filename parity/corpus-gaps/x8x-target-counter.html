<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@page { size: 200px 160px; margin: 10px }
body { font-family: "Noto Serif"; font-size: 12px; line-height: 1.4 }
a::after { content: " (p. " target-counter(attr(href), page) ")" }
a::before { content: target-text(attr(href), content()) " " }
.sec { break-before: page }
</style></head><body>
<p><a href="#one">See section one</a> and <a href="#two">section two</a>.</p>
<h2 id="one">One</h2><p>Body of one.</p>
<h2 id="two" class="sec">Two</h2><p>Body of two.</p>
</body></html>
