<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@page { size: 200px 120px; margin: 10px }
body { font-family: "Noto Serif"; font-size: 16px; line-height: 1.4 }
.box { display: inline-block; background: #ddd; padding: 4px; border: 1px solid #555 }
.mid { vertical-align: middle }
.base { vertical-align: baseline }
.big { font-size: 28px }
</style></head><body>
<p>Text <span class="box mid">middle box</span> after and <span class="box base">base</span> then <span class="box mid big">big</span> end.</p>
<p>Two lines <span class="box mid">a<br>b<br>c</span> with a tall block.</p>
</body></html>
