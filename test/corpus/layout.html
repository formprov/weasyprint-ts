<!doctype html><html><head><meta charset="utf-8"><style>
@page { size: letter; margin: 20mm }
body { font-family: 'Noto Sans'; font-size: 14px }
.card { border: 1px solid #ddd; border-radius: 8px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.15); max-width: 400px }
.flex { display: flex; flex-direction: column; margin-top: 12px }
.row { display: flex; justify-content: space-between }
.stamp { position: absolute; top: 18%; left: 45%; transform: translate(-40%, -30%) rotate(5deg); opacity: 0.5; z-index: 1;
         font-size: 40px; font-weight: bold; color: #2e7d32 }
</style></head><body>
<div class="card"><strong>Flyer card</strong> with a shadow and rounded corners.</div>
<div class="flex">
  <div class="row"><span>Design</span><span>40.00</span></div>
  <div class="row"><span>Printing</span><span>120.00</span></div>
</div>
<div class="stamp">DRAFT</div>
</body></html>
