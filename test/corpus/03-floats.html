<!doctype html><html><head><style>
@page { size: letter; margin: 20mm }
body { font-family: 'Noto Sans'; font-size: 13px }
.f { float: left; width: 120px; height: 80px; background: #cfc; margin: 0 10px 10px 0 }
.fr { float: right; width: 100px; height: 60px; background: #fcc; margin: 0 0 10px 10px }
.clear { clear: both }
</style></head><body>
<div class="f">float left</div>
<div class="fr">float right</div>
<p>Text flowing around the floated boxes with several words to demonstrate the wrapping behavior around both floats at once.</p>
<p class="clear">After the clear.</p>
</body></html>
