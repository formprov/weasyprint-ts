<!doctype html><html><head><meta charset="utf-8"><style>
@page { size: A4; margin: 20mm; @bottom-center { content: counter(page) } }
body { font-family: 'Noto Sans'; font-size: 13px; line-height: 1.6 }
.break { page-break-before: always }
</style></head><body>
<h2>First page</h2>
<p>Content on the first page of a multi-page document with page counters at the bottom.</p>
<div class="break"></div>
<h2>Second page</h2>
<p>Content on the second page.</p>
<div class="break"></div>
<h2>Third page</h2>
<p>Content on the third page.</p>
</body></html>
