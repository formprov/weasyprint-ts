<!doctype html><html><head><meta charset="utf-8"><style>
@page { size: letter; margin: 25mm }
body { font-family: 'Noto Sans'; font-size: 14px; line-height: 1.5; color: #333 }
h1 { color: #123; } h2 { border-bottom: 1px solid #ccc }
.lead { font-weight: bold }
</style></head><body>
<h1>Heading one</h1>
<p class="lead">A lead paragraph with <strong>bold</strong>, <em>italic</em> and a <a href="https://example.com">link</a>.</p>
<h2>Heading two</h2>
<p>Body text with a list following.</p>
<ul><li>First item</li><li>Second item with more text to wrap around</li><li>Third</li></ul>
<h3>Heading three</h3>
<p>Final paragraph.</p>
</body></html>
